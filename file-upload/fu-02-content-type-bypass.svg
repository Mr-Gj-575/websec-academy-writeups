<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 586" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="700" height="586" fill="#0d1117"/>
<rect x="40" y="24" width="150" height="28" rx="6" fill="#dc2626"/>
<text x="115" y="43" font-size="13" font-weight="700" fill="#0d1117" text-anchor="middle">FILE UPLOAD</text>
<text x="40" y="68" font-size="17" font-weight="700" fill="#e6edf3">Web Shell Upload — Content-Type Bypass</text>
<rect x="40" y="90" width="620" height="78" rx="10" fill="#161b22" stroke="#dc2626" stroke-width="2"/>
<text x="60" y="114" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">STEP 1</text>
<text x="60" y="136" font-size="15" fill="#e6edf3">Server checks the Content-Type header of the upload</text>
<line x1="350.0" y1="168" x2="350.0" y2="204" stroke="#dc2626" stroke-width="3"/>
<polygon points="342.0,198 358.0,198 350.0,212" fill="#dc2626"/>
<rect x="40" y="214" width="620" height="78" rx="10" fill="#161b22" stroke="#dc2626" stroke-width="2"/>
<text x="60" y="238" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">STEP 2</text>
<text x="60" y="260" font-size="15" fill="#e6edf3">Edit multipart body, set Content-Type to image/jpeg</text>
<line x1="350.0" y1="292" x2="350.0" y2="328" stroke="#dc2626" stroke-width="3"/>
<polygon points="342.0,322 358.0,322 350.0,336" fill="#dc2626"/>
<rect x="40" y="338" width="620" height="78" rx="10" fill="#161b22" stroke="#dc2626" stroke-width="2"/>
<text x="60" y="362" font-size="11" font-weight="700" letter-spacing="1" fill="#dc2626">STEP 3</text>
<text x="60" y="384" font-size="15" fill="#e6edf3">Check passes since header is client-controlled only</text>
<line x1="350.0" y1="416" x2="350.0" y2="452" stroke="#dc2626" stroke-width="3"/>
<polygon points="342.0,446 358.0,446 350.0,460" fill="#dc2626"/>
<rect x="40" y="462" width="620" height="78" rx="10" fill="#dc2626" stroke="#dc2626" stroke-width="2"/>
<text x="60" y="486" font-size="11" font-weight="700" letter-spacing="1" fill="#0d1117">RESULT</text>
<text x="60" y="508" font-size="15" fill="#0d1117">PHP file stored and executable despite spoofed header</text>
</svg>